<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Video Editor — Spike</title>
<style>
  :root {
    --bg: #1e1f22;
    --panel: #2a2b2e;
    --track: #35363a;
    --accent: #5b8cff;
    --text: #e6e6e6;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #000;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:disabled {
    background: #444;
    color: var(--muted);
    cursor: not-allowed;
  }
  .preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  video {
    max-width: 100%;
    max-height: 100%;
  }
  .timeline-wrap {
    background: var(--panel);
    padding: 14px;
    border-top: 1px solid #000;
  }
  .timeline-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .timeline {
    position: relative;
    height: 56px;
    background: var(--track);
    border-radius: 4px;
    overflow: visible;
  }
  .clip {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    right: 0;
    background: #3d6fd6;
    border-radius: 3px;
  }
  .trim-region {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(91, 140, 255, 0.25);
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }
  .handle {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 10px;
    background: var(--accent);
    border-radius: 2px;
    cursor: ew-resize;
    z-index: 2;
  }
  .handle.left { left: 0; margin-left: -5px; }
  .handle.right { left: 0; margin-left: -5px; }
  .status {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="loadBtn">Load Clip…</button>
    <button id="exportBtn" disabled>Export Trim…</button>
    <span class="status" id="status">No clip loaded</span>
  </div>

  <div class="preview">
    <video id="video" controls></video>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-labels">
      <span id="startLabel">0:00</span>
      <span id="endLabel">0:00</span>
    </div>
    <div class="timeline" id="timeline">
      <div class="clip"></div>
      <div class="trim-region" id="trimRegion"></div>
      <div class="handle left" id="handleStart"></div>
      <div class="handle right" id="handleEnd"></div>
    </div>
  </div>

  <script>
    const videoEl = document.getElementById('video');
    const loadBtn = document.getElementById('loadBtn');
    const exportBtn = document.getElementById('exportBtn');
    const statusEl = document.getElementById('status');
    const timeline = document.getElementById('timeline');
    const trimRegion = document.getElementById('trimRegion');
    const handleStart = document.getElementById('handleStart');
    const handleEnd = document.getElementById('handleEnd');
    const startLabel = document.getElementById('startLabel');
    const endLabel = document.getElementById('endLabel');

    let currentPath = null;
    let duration = 0;
    let trimStart = 0;
    let trimEnd = 0;

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function pctToSec(pct) {
      return (pct / 100) * duration;
    }

    function secToPct(sec) {
      return duration ? (sec / duration) * 100 : 0;
    }

    function renderTrim() {
      const leftPct = secToPct(trimStart);
      const rightPct = secToPct(trimEnd);
      trimRegion.style.left = leftPct + '%';
      trimRegion.style.width = (rightPct - leftPct) + '%';
      handleStart.style.left = leftPct + '%';
      handleEnd.style.left = rightPct + '%';
      startLabel.textContent = fmt(trimStart);
      endLabel.textContent = fmt(trimEnd);
    }

    function dragHandle(handleEl, isStart) {
      handleEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const onMove = (moveEvent) => {
          const rect = timeline.getBoundingClientRect();
          let pct = ((moveEvent.clientX - rect.left) / rect.width) * 100;
          pct = Math.max(0, Math.min(100, pct));
          const sec = pctToSec(pct);
          if (isStart) {
            trimStart = Math.min(sec, trimEnd - 0.1);
            trimStart = Math.max(0, trimStart);
          } else {
            trimEnd = Math.max(sec, trimStart + 0.1);
            trimEnd = Math.min(duration, trimEnd);
          }
          renderTrim();
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
    }

    dragHandle(handleStart, true);
    dragHandle(handleEnd, false);

    loadBtn.addEventListener('click', async () => {
      const filePath = await window.editorAPI.pickVideo();
      if (!filePath) return;
      currentPath = filePath;
      videoEl.src = `file://${filePath}`;
      statusEl.textContent = 'Loading metadata…';
    });

    videoEl.addEventListener('loadedmetadata', () => {
      duration = videoEl.duration;
      trimStart = 0;
      trimEnd = duration;
      renderTrim();
      exportBtn.disabled = false;
      statusEl.textContent = `Loaded — ${fmt(duration)}`;
    });

    exportBtn.addEventListener('click', async () => {
      if (!currentPath) return;
      exportBtn.disabled = true;
      statusEl.textContent = 'Exporting…';
      const result = await window.editorAPI.exportTrim({
        inputPath: currentPath,
        startSec: trimStart,
        endSec: trimEnd,
      });
      exportBtn.disabled = false;
      if (result.ok) {
        statusEl.textContent = `Exported to ${result.outputPath}`;
      } else if (result.reason === 'canceled') {
        statusEl.textContent = 'Export canceled';
      } else {
        statusEl.textContent = 'Export failed — see console';
        console.error(result.reason);
      }
    });
  </script>
</body>
</html>
