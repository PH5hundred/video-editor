<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Video Editor — Spike</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <button id="addTrackBtn">+ Add Track</button>
    <button id="exportBtn" disabled>Export Selected Clip…</button>
    <span class="status" id="status">No clip loaded</span>
  </div>

  <div class="preview">
    <video id="video" controls></video>
  </div>

  <div class="timeline-wrap">
    <div id="tracks"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
